<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            height: 100dvh;
            width: 100%;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <form>
            <div class="form-control">
                <label for="fullName">Full Name</label>
                <input placeholder="Enter Full Name" type="text" name="fullName" id="fullName" />
            </div>

            <div class="form-control">
                <label for="email">Email</label>
                <input type="email" placeholder="Enter Email" name="email" id="email" />
            </div>

            <div class="form-control">
                <label for="password">Password</label>
                <input type="password" placeholder="Enter Password" name="email" id="email" />
            </div>

            <div class="form-control">
                <label for="contact">Contact Number</label>
                <input type="tel" name="contact" id="contact" />
            </div>

            <div class="form-control">
                <label for="address">Address</label>
                <input type="text" name="address" id="address" />
            </div>

            <div class="form-control">
                <label>Gender</label>
                <input type="radio" name="gender" id="male" />
                <label for="male">Male</label>
                <input type="radio" name="gender" id="female" />
                <label for="female">Female</label>
            </div>

            
            <div class="form-control">
                <label>Hobbies</label>
                <input type="checkbox" name="hobbies" id="music" />
                <label for="music">Music</label>
                
                <input type="checkbox" name="hobbies" id="dance" />
                <label for="dance">Dancing</label>
                
                <input type="checkbox" name="hobbies" id="skech" />
                <label for="skech">Skeching</label>
            </div>


            <button>
                Submit
            </button>
        </form>
    </div>
</body>

</html>
