<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
</head>

<body>
    <script>
        //For loop
        for (let i = 1; i <= 10; i++) {
            //loop Body
            console.log(i)
        }
        //entry level
        for (let j = 5; j >= 1; j--) {
            console.log(j)
        }

        //do while ==>> exit level
        let k = 1
        do {
            console.log(k)
            k++
        } while (k <= 7)
    </script>
</body>

</html>
