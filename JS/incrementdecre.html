<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    
    <script>

        let number = 34

        console.log(number++)  //post increment
        console.log(number)
        console.log(++number)
        console.log(--number)
        console.log(number--)
        console.log(number)
        

        
    </script>
</body>
</html>
