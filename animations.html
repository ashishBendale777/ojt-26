<!DOCTYPE html>
<html>

<head>
    <title>CSS Transform Demo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eee;
            text-align: center;
            font-family: Arial;
        }

        .box {
            width: 150px;
            height: 150px;
            background: dodgerblue;
            color: white;

            margin: 150px auto;

            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            animation: scale 4s infinite;
        }

        @keyframes slide {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-200px);
            }
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);

            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes skew {
            0% {
                transform: skewX(0deg);

            }

            100% {
                transform: skewX(360deg);
            }
        }

        @keyframes scale {
            0% {
                transform: scaleX(0);

            }

            100% {
                transform: scaleX(300px);
            }
        }
    </style>
</head>

<body>

    <h1>CSS Transform Functions</h1>

    <div class="box">
        BOX
    </div>

</body>

</html>
