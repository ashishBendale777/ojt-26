<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            height: 100dvh;
            width: 100%;
        }

        section {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        section h1{
            font-size: 3rem;
            text-align: center;
        }

        .card-container {
            width: 80%;
            height: 80%;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .card-item {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 80%;
            gap: 10px;
            border: 3px solid cyan;
        }

        .card-item i{
            font-size: 6rem;
            color: red;
        }
        .card-item h4{
            font-size: 2.5rem;
            letter-spacing: 5px;
        }

        .card-item p{
            text-align: center;
            font-size: 1.3rem;
        }

        .card-item button{
            background-color: blueviolet;
            font-size: larger;
            width: 60%;
            border-radius: 12px;
            padding: 6px;
            border: none;
        }
    </style>
</head>

<body>
    <section>
        <h1>
            Social Cards
        </h1>

        <div class="card-container">
            <div class="card-item">
                <i class="fa-brands fa-facebook"></i>
                <h4>FaceBook</h4>
                <p>
                    Lorem ipsum dolor sit, amet consectetur adipisicing elit. Ut numquam
                </p>
                <button>
                    read more
                </button>
            </div>
            <div class="card-item">
                <i class="fa-brands fa-facebook"></i>

                <h4>Twitter</h4>
                <p>
                    Lorem ipsum dolor sit, amet consectetur adipisicing elit. Ut numquam
                </p>
                <button>
                    read more
                </button>
            </div>
            <div class="card-item">
                <i class="fa-brands fa-youtube"></i>

                <h4>Youtube</h4>
                <p>
                    Lorem ipsum dolor sit, amet consectetur adipisicing elit. Ut numquam
                </p>
                <button>
                    read more
                </button>
            </div>
        </div>
    </section>
</body>

</html>
